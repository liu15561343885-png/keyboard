name: PrivateKeyboard
options:
  bundleIdPrefix: com.liu15561343885
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  PrivateKeyboardCore:
    path: .
targets:
  PrivateKeyboard:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: App
      - path: Resources/UpdatePublicKey.txt
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: PRIVACY.md
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: licenses
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liu15561343885.privatekeyboard
        PRODUCT_NAME: PrivateKeyboard
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PrivateKeyboard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: PrivateKeyboardCore
      - package: PrivateKeyboardCore
        product: PrivateKeyboardUpdater
      - target: PrivateKeyboardKeyboard
        embed: true
  PrivateKeyboardKeyboard:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: KeyboardExtension
      - path: Resources/Generated
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liu15561343885.privatekeyboard.keyboard
        PRODUCT_NAME: PrivateKeyboardKeyboard
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/KeyboardExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: PrivateKeyboardCore
  PrivateKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/KeyboardUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liu15561343885.privatekeyboard.uitests
        TEST_TARGET_NAME: PrivateKeyboard
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PrivateKeyboard
  PrivateKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PrivateKeyboardCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liu15561343885.privatekeyboard.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PrivateKeyboard.app/PrivateKeyboard"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - package: PrivateKeyboardCore
      - package: PrivateKeyboardCore
        product: PrivateKeyboardUpdater
      - target: PrivateKeyboard
schemes:
  PrivateKeyboard:
    build:
      targets:
        PrivateKeyboard: all
        PrivateKeyboardKeyboard: all
        PrivateKeyboardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PrivateKeyboardTests

  PrivateKeyboardUITests:
    build:
      targets:
        PrivateKeyboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrivateKeyboardUITests
