name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-and-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | head -30

      - name: Build Swift package
        run: swift build

      - name: Privacy audit
        run: ./scripts/check_privacy.sh

      - name: Artifact and configuration integrity
        run: |
          python3 scripts/check_artifacts.py
          swift run -c release manifest-tool verify docs/manifest.example.json Resources/UpdatePublicKey.txt

      - name: Core end-to-end checks
        run: swift run -c release core-check Resources/Generated

      - name: Catalyst UI smoke checks
        run: |
          ./scripts/typecheck_catalyst.sh
          ./scripts/build_catalyst_products.sh
          ./scripts/smoke_keyboard_catalyst.sh

      - name: Package tests (XCTest)
        run: swift test

      - name: Build iOS app and keyboard extension
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateKeyboard.xcodeproj \
            -scheme PrivateKeyboard \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/PrivateKeyboardDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log

      - name: Run Xcode unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateKeyboard.xcodeproj \
            -scheme PrivateKeyboard \
            -configuration Debug \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -derivedDataPath /tmp/PrivateKeyboardDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee -a /tmp/xcodebuild.log

      - name: Verify extension does not link the updater product
        run: |
          APPEX=/tmp/PrivateKeyboardDerivedData/Build/Products/Debug-iphonesimulator/PrivateKeyboard.app/PlugIns/PrivateKeyboardKeyboard.appex
          if [ -f "$APPEX/PrivateKeyboardKeyboard" ]; then
            if nm -u "$APPEX/PrivateKeyboardKeyboard" | grep -q 'URLSession'; then
              echo "::error::keyboard extension references URLSession"
              exit 1
            fi
            echo "extension binary has no URLSession reference"
          else
            echo "::warning::extension binary not found for symbol check"
          fi

      - name: Publish CI failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/xcodebuild.log ]; then
            echo "no xcodebuild log to publish"
            exit 0
          fi
          tail -n 20000 /tmp/xcodebuild.log > /tmp/ci-xcodebuild.log
          rm -rf /tmp/ci-diagnostics
          mkdir -p /tmp/ci-diagnostics
          cd /tmp/ci-diagnostics
          git init -q
          git config user.name "PrivateKeyboard CI"
          git config user.email "ci@privatekeyboard.local"
          cp /tmp/ci-xcodebuild.log xcodebuild.log
          git add xcodebuild.log
          git commit -q -m "CI diagnostics for ${GITHUB_SHA}"
          git branch -M ci-diagnostics
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin HEAD:ci-diagnostics
